name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on the self-hosted runners (.github/RUNNER.md). setup creates
# this run's conda env under $CI_ENV_ROOT, the other jobs load it with
# ci/env.sh, and cleanup deletes it.
jobs:
  setup:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: ./.github/actions/pull-extras
      - name: Create Conda Environment
        run: |
          export PATH=$HOME/miniforge3/condabin:$PATH
          source $(conda info --base)/etc/profile.d/conda.sh
          ENV_PATH=${CI_ENV_ROOT:?}/ci-env-${{ github.run_id }}
          conda env create -p $ENV_PATH -f environment.yml
          conda env update -p $ENV_PATH -f utils/hls-tidy-plugin/environment.yml
          conda activate $ENV_PATH
          pip uninstall -y voyager-compiler
          pip install ./voyager-compiler

  lint:
    needs: setup
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: ./.github/actions/pull-extras
      - name: Build HLS Checks & Run Clang Tidy
        run: |
          source ci/env.sh
          cd utils/hls-tidy-plugin
          mkdir -p build && cd build
          CC=clang CXX=clang++ cmake .. -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          make -j4
          cd $PROJECT_ROOT

          make test/compiler/proto/voyager_ir.pb.cc

          for type in E4M3 MXINT8; do
            NETWORK=resnet18 DATATYPE=$type IC_DIMENSION=16 OC_DIMENSION=16 CLOCK_PERIOD=5 TECHNOLOGY=generic compiledb make -n TestRunner-fast
            clang-tidy "-checks=hls-*,-clang-*" -load=utils/hls-tidy-plugin/build/libCatapultHlsChecks.so -p=$PROJECT_ROOT -header-filter="src/" test/common/Harness.cc > clang_tidy_output_$type.txt 2>&1 || true
          done
      - name: Generate GitHub PR Annotations
        run: |
          source ci/env.sh
          python .github/scripts/clang_tidy_to_github.py clang_tidy_output_E4M3.txt clang_tidy_output_MXINT8.txt
      - name: Upload Raw Lint Logs
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-logs
          path: clang_tidy_output_*.txt
          retention-days: 7

  # A row runs ci/run.sh <config> <sims> <networks>: config names
  # ci/configs/<config>.env, and a network compiled with its own settings
  # (ci/networks/<network>.env) gets a row of its own.
  systemc_simulation:
    needs: setup
    runs-on: self-hosted
    env:
      CONV2D_IM2COL: 1
      CLOCK_PERIOD: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: E4M3-16x16,       networks: resnet18 }
          - { config: E4M3-16x16,       networks: mobilebert_encoder }
          - { config: P8_1-16x16,       networks: resnet18 }
          - { config: P8_1-16x16,       networks: mobilebert_encoder }
          - { config: INT8-16x16,       networks: resnet18 }
          - { config: INT8-16x16,       networks: mobilebert_encoder }
          - { config: MXINT8-16x16-DWC, networks: "resnet18,mobilenet_v2" }
          - { config: MXINT8-16x16-DWC, networks: mobilebert_encoder }
          - { config: MXNF4-64x64,      networks: "llama_prefill,llama_decode,llama_decode_kivi,resnet18,resnet50,vit,bert" }
          - { config: MXNF4-64x64,      networks: llama_prefill_mp }
          - { config: MXNF4-64x64,      networks: llama_prefill_spmm }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: ./.github/actions/pull-extras
      - name: Run Regression
        run: |
          source ci/env.sh
          ci/run.sh ${{ matrix.config }} fast-systemc "${{ matrix.networks }}"

  rtl_simulation:
    needs: setup
    runs-on: self-hosted
    env:
      CONV2D_IM2COL: 1
      CLOCK_PERIOD: 5
      TECHNOLOGY: generic
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: E4M3-32x64,   networks: "resnet18,resnet50" }
          - { config: E4M3-16x16,   networks: resnet18 }
          - { config: E4M3-16x16,   networks: mobilebert_encoder }
          - { config: E4M3-4x8,     networks: resnet18 }
          - { config: E4M3-4x8,     networks: mobilebert_encoder }
          - { config: P8_1-16x16,   networks: resnet18 }
          - { config: P8_1-16x16,   networks: mobilebert_encoder }
          - { config: INT8-16x16,   networks: resnet18 }
          - { config: INT8-16x16,   networks: mobilebert_encoder }
          - { config: MXINT8-16x16, networks: resnet18 }
          - { config: MXINT8-16x16, networks: mobilebert_encoder }
          - { config: MXNF4-64x64,  networks: "llama_prefill,llama_decode,llama_decode_kivi,resnet18,resnet50,vit,bert" }
          - { config: MXNF4-64x64,  networks: llama_prefill_mp }
          - { config: MXNF4-64x64,  networks: llama_prefill_spmm }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: ./.github/actions/pull-extras
      - name: Run RTL Regression
        run: |
          source ci/env.sh
          ci/run.sh ${{ matrix.config }} rtl "${{ matrix.networks }}"
      # check_pull_request.py reads the datatype and array size from the
      # first two dash-separated parts of this name.
      - name: Upload Regression Results
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-${{ matrix.config }}-${{ strategy.job-index }}
          path: regression_results/latest/test_results.pkl
          retention-days: 7

  accuracy:
    needs: setup
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - { model: vit,        dataset: imagenet, type: CFLOAT }
          - { model: vit,        dataset: imagenet, type: INT8 }
          - { model: vit,        dataset: imagenet, type: MXINT8 }
          - { model: resnet18,   dataset: imagenet, type: CFLOAT }
          - { model: resnet18,   dataset: imagenet, type: E4M3 }
          - { model: resnet18,   dataset: imagenet, type: INT8 }
          - { model: resnet18,   dataset: imagenet, type: MXINT8 }
          - { model: mobilebert, dataset: sst2,     type: CFLOAT }
          - { model: mobilebert, dataset: sst2,     type: E4M3 }
          - { model: mobilebert, dataset: sst2,     type: INT8 }
          - { model: mobilebert, dataset: sst2,     type: MXINT8 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: ./.github/actions/pull-extras
      - name: Run Accuracy
        run: |
          source ci/env.sh
          DATATYPE=${{ matrix.type }} IC_DIMENSION=16 OC_DIMENSION=16 CONV2D_IM2COL=1 python run_regression.py --models ${{ matrix.model }} --dataset ${{ matrix.dataset }} --sims accuracy --num_processes 16

  # Compares each network's runtime with the latest successful run on main
  # and fails if any got slower.
  check_results:
    needs: rtl_simulation
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Check Pull Request Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          source ci/env.sh
          pip install pandas requests
          python .github/scripts/check_pull_request.py

  cleanup:
    needs: [lint, systemc_simulation, rtl_simulation, accuracy, check_results]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Remove Conda Env
        run: rm -rf "${CI_ENV_ROOT:?}/ci-env-${{ github.run_id }}"
